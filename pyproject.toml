[project]
name = "toolkit-radar"
version = "0.1.0"
description = "Agentic research pipeline that decides which of 100 SaaS apps can become an agent toolkit today"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
mcp = ["mcp>=1.2"]

[tool.setuptools]
packages = ["agent"]
